services:
  web:
    build: .
    image: supermarketweb
    ports:
      - "8080:8080"
    environment:
      # Usuarios de demostración (admin@supermarket.local / Admin123! y cajero@supermarket.local / Cajero123!)
      # y 30 días de operación simulada si la base no tiene ventas.
      SeedDemoUser: "true"
      SeedDemoData: "true"
    volumes:
      - supermarket-data:/app/data
    restart: unless-stopped

volumes:
  supermarket-data:
